name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not report security vulnerabilities here** — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Backend, Frontend, Data source connectors, AI catalogue, Compliance workflows, IAM, Docker / deployment, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Remove any credentials or personal data first.
      render: shell
