name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Data Guardian/backend
    env:
      SECRET_KEY: ci-only-not-a-secret
      DB_PATH: ${{ runner.temp }}/ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Data Guardian/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Lint (ruff, correctness rules)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Django system check
        run: python manage.py check
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Data Guardian/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Data Guardian/frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
